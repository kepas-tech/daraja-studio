# darajastudio.com — the marketing page.
#
# Its own container on the loopback, so the page and the studio never share a
# process. The Cloudflare route for darajastudio.com and www.darajastudio.com
# points here, except the path rules that stay with the studio (see README.md
# for the route, and for what leaves the studio's own configuration after it).
#
# Two things this file means on purpose:
#   * a callback path is never answered with a redirect, because Safaricom was
#     given the old address and expects its answer there;
#   * anything else that is not the page goes on to the studio, so an address
#     somebody bookmarked before the move still lands where it did.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The page itself, and the files beside it.
    location = / { }
    location /assets/ { expires 1h; }

    # A callback path here gets no redirect: once the two-week window is over
    # the old address simply has nothing at that path.
    location ^~ /cb { return 404; }

    # Everything else goes on to the studio, path and query included.
    location / { try_files $uri @studio; }

    location @studio {
        return 301 https://studio.kepas.co.ke$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}

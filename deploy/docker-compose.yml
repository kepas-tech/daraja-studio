services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: studio
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U studio"], interval: 10s, timeout: 5s, retries: 10 }

  studio:
    image: ghcr.io/kepas-tech/daraja-studio:${STUDIO_VERSION:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@postgres:5432/studio
      STUDIO_SECRET_KEY: ${STUDIO_SECRET_KEY}
      STUDIO_PUBLIC_URL: "${STUDIO_PUBLIC_URL:-https://${STUDIO_DOMAIN}}"
      STUDIO_TRUST_PROXY: "${STUDIO_TRUST_PROXY:-1}"
      STUDIO_PORT: "8080"
      # Optional per-send cap from deploy/.env (see "Going live carefully" in README.md); empty = no cap.
      STUDIO_MAX_SEND_CENTS: "${STUDIO_MAX_SEND_CENTS:-}"
      # single (default) = one organisation, today's product. hosted = many organisations; only
      # darajastudio.com runs that. Empty is treated as unset, so leaving it out is safe.
      STUDIO_MODE: "${STUDIO_MODE:-}"
      STUDIO_PLANS: "${STUDIO_PLANS:-}"
      # Hosted mode only: the addresses Safaricom sees requests coming from, comma-separated.
      STUDIO_SMTP_HOST: ${STUDIO_SMTP_HOST:-}
      STUDIO_SMTP_PORT: ${STUDIO_SMTP_PORT:-465}
      STUDIO_SMTP_USER: ${STUDIO_SMTP_USER:-}
      STUDIO_SMTP_PASSWORD: ${STUDIO_SMTP_PASSWORD:-}
      STUDIO_SMTP_FROM: ${STUDIO_SMTP_FROM:-}
      STUDIO_EGRESS_IPS: "${STUDIO_EGRESS_IPS:-}"
      # Web push (feature 12). All three come from deploy/.env and are needed together; leave them
      # out and push is off with no button, no sender and no service worker.
      STUDIO_VAPID_PUBLIC_KEY: "${STUDIO_VAPID_PUBLIC_KEY:-}"
      STUDIO_VAPID_PRIVATE_KEY: "${STUDIO_VAPID_PRIVATE_KEY:-}"
      STUDIO_VAPID_SUBJECT: "${STUDIO_VAPID_SUBJECT:-}"
      # The address move: hostnames this studio has left behind, and the date the redirect stops on
      # its own. Both empty in a fresh install, which is no rule at all; see app.ts.
      STUDIO_REDIRECT_OLD_ADDRESSES: "${STUDIO_REDIRECT_OLD_ADDRESSES:-}"
      STUDIO_REDIRECT_UNTIL: "${STUDIO_REDIRECT_UNTIL:-}"
    expose: ["8080"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"], interval: 10s, timeout: 5s, retries: 10 }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { STUDIO_DOMAIN: "${STUDIO_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: { studio: { condition: service_healthy } }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: ["backups:/backups", "./backup.sh:/backup.sh:ro"]
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  backups: {}
